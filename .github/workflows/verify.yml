name: Verify CricVault

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - name: Compile, lint, and test Android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "(^e: |error:|FAILURE:|What went wrong|Execution failed|Could not|Exception)" android-build.log | tail -n 24 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cricvault-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
